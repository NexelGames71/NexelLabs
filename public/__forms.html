<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="project-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-inquiry" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="inquirySubject" />
      <select name="projectType">
        <option value="Business website">Business website</option>
        <option value="Landing page">Landing page</option>
        <option value="Web application">Web application</option>
        <option value="Mobile app">Mobile app</option>
        <option value="Custom software">Custom software</option>
        <option value="Dashboard or admin panel">Dashboard or admin panel</option>
        <option value="MVP for startup">MVP for startup</option>
        <option value="Something else">Something else</option>
      </select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
